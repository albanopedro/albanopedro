<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Pedro Albano — software developer">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .name { font-size: 88px; font-weight: 800; letter-spacing: 3px; }
    .white { fill: #f2f2f2; }
    .red { fill: #ff1f3d; opacity: .85; animation: glitch-a 6s infinite; }
    .dark { fill: #7a0016; animation: glitch-b 6s infinite; }
    .tag { font-size: 16px; fill: #ff1f3d; letter-spacing: 3px; }
    .muted { font-size: 14px; fill: #6b6b6b; letter-spacing: 2px; }
    .cursor { fill: #ff1f3d; animation: blink 1.1s steps(1) infinite; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes scan { from { transform: translateY(-90px); } to { transform: translateY(300px); } }
    @keyframes glitch-a {
      0%, 88%, 100% { transform: translate(-3px, 0); }
      89% { transform: translate(-11px, -2px); }
      90.5% { transform: translate(7px, 2px); }
      92% { transform: translate(-3px, 0); }
    }
    @keyframes glitch-b {
      0%, 88%, 100% { transform: translate(3px, 0); }
      89% { transform: translate(9px, 3px); }
      90.5% { transform: translate(-6px, -1px); }
      92% { transform: translate(3px, 0); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="10"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff1f3d" stroke-opacity=".07"/>
    </pattern>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" fill-opacity=".025"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff1f3d" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0a0a0a"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- hud frame -->
    <g fill="none" stroke="#ff1f3d" stroke-width="2">
      <path d="M24 52V24h28M1148 24h28v28M24 248v28h28M1148 276h28v-28"/>
    </g>
    <text x="64" y="50" class="muted">~/albanopedro</text>
    <text x="1136" y="50" class="muted" text-anchor="end">BAURU · SP · BR</text>

    <!-- name: two offset copies for the glitch, cursor kept in all three so they center the same -->
    <text x="600" y="170" class="name dark" text-anchor="middle">PEDRO ALBANO<tspan fill-opacity="0">_</tspan></text>
    <text x="600" y="170" class="name red" text-anchor="middle">PEDRO ALBANO<tspan fill-opacity="0">_</tspan></text>
    <text x="600" y="170" class="name white" text-anchor="middle">PEDRO ALBANO<tspan class="cursor">_</tspan></text>
    <text x="600" y="218" class="tag" text-anchor="middle">SOFTWARE DEVELOPER // AUTOMATION // EMBEDDED // WEB</text>

    <rect width="1200" height="300" fill="url(#lines)"/>
    <rect width="1200" height="90" fill="url(#band)" class="scan"/>
  </g>
</svg>
