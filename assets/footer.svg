<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="albanopedro@github:~$ exit — process exited with code 0">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; }
    .prompt { fill: #ff1f3d; }
    .cmd { fill: #e6e6e6; }
    .exit { fill: #6b6b6b; letter-spacing: 1px; }
    .code { fill: #ff1f3d; }
    .cursor { fill: #ff1f3d; animation: blink 1.1s steps(1) infinite; }
    .sweep { animation: sweep 4s ease-in-out infinite alternate; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1040px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="110" rx="10"/></clipPath>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff1f3d"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="110" rx="10" fill="#0a0a0a"/>
    <rect x="0" y="0" width="1200" height="2" fill="#3b000b"/>
    <rect x="0" y="0" width="160" height="2" fill="url(#beam)" class="sweep"/>
    <text x="48" y="64"><tspan class="prompt">albanopedro@github</tspan><tspan class="cmd">:~$ exit</tspan><tspan class="cursor">_</tspan></text>
    <text x="1152" y="64" text-anchor="end" class="exit">[ process exited with code <tspan class="code">0</tspan> ]</text>
  </g>
</svg>
